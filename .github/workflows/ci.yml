name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC: catch new advisories and lints without a push
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
  yubikey:
    # The `yubikey` feature links libpcsclite. Tests use aivyx-yubi's
    # FakeCard (feature test-util); no real card is involved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --features test-util
      - run: cargo clippy --all-targets --all-features -- -D warnings
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
